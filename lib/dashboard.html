<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;
  --bg:#f5f6f8;--surface:#fff;--sunk:#f1f2f5;--line:#e4e6eb;--line2:#d3d6dd;--fg:#14171f;--mut:#667085;--faint:#98a2b3;--brand:#4f46e5;--brand-bg:#eef0ff;
  --ok:#16a34a;--ok-bg:#e8f7ee;--warn:#c2680a;--warn-bg:#fff3de;--bad:#d92d20;--bad-bg:#fdecea;--run:#2563eb;--run-bg:#e8f0fe;
  --add:#e8f7ee;--del:#fdecea;--hunk:#eef0ff;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--shadow-lg:0 12px 40px rgba(16,24,40,.18)}
@media(prefers-color-scheme:dark){:root{
  --bg:#0c0e13;--surface:#14171e;--sunk:#1a1e27;--line:#242935;--line2:#323847;--fg:#e7e9ee;--mut:#8f97aa;--faint:#626b80;--brand:#8b85ff;--brand-bg:#1f2040;
  --ok:#4ade80;--ok-bg:#12281b;--warn:#fbbf24;--warn-bg:#33260a;--bad:#f87171;--bad-bg:#361614;--run:#7aa7ff;--run-bg:#14264a;
  --add:#12281b;--del:#361614;--hunk:#1f2040;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.mut{color:var(--mut)}.faint{color:var(--faint)}.small{font-size:12px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:beat 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:550;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--sunk)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.row:focus-visible,.kpi:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}.btn.primary:hover:not(:disabled){background:var(--ok);filter:brightness(1.08)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn.brand:hover:not(:disabled){background:var(--brand);filter:brightness(1.1)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}.btn.danger{color:var(--bad)}.btn.ghost{border-color:transparent;box-shadow:none;background:none}
@media(prefers-color-scheme:dark){.btn.primary,.btn.warn,.btn.brand{color:#0c0e13}}
.page{max-width:1320px;margin:0 auto;padding:22px 24px 64px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:block;transition:border-color .12s}
.kpi:hover{border-color:var(--line2)}.kpi.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.kpi .lb{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;font-weight:550;text-transform:uppercase;letter-spacing:.05em}
.kpi .lb i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.kpi .nm{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .ft{color:var(--mut);font-size:12px}
.kpi.warn .lb i{background:var(--warn)}.kpi.warn.hot .nm{color:var(--warn)}.kpi.run .lb i{background:var(--run)}.kpi.bad .lb i{background:var(--bad)}.kpi.bad.hot .nm{color:var(--bad)}.kpi.ok .lb i{background:var(--ok)}.kpi.brand .lb i{background:var(--brand)}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
main,aside{min-width:0}
@media(max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.top-in,.page{padding-left:14px;padding-right:14px}#repos{display:none}.d-head,.d-body,.d-foot{padding-left:14px;padding-right:14px}.kpi .nm{font-size:24px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:13px;font-weight:650}.panel-h .count{color:var(--mut);font-size:12px}
.section{margin-bottom:20px}
/* attention queue */
.attn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:linear-gradient(var(--warn-bg),var(--surface) 70px)}
.attn-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.attn-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-s{color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
/* toolbar */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.search{position:relative;flex:1;min-width:160px}.search svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
select.sel{padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--mut);font-weight:550;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--brand-bg);color:var(--brand)}
/* table */
.thead,.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(190px,1.5fr) 150px 70px 70px 80px;gap:14px;align-items:center;padding:0 16px}
.thead{height:34px;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.row{padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.row:last-child{border-bottom:0}.row:hover{background:var(--sunk)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm small{color:var(--mut);font-weight:500;font-size:inherit}
.row .ds{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;color:var(--mut)}
@media(max-width:860px){.thead{display:none}.row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.row>:nth-child(2){grid-column:1/-1;order:3}.row>:nth-child(4),.row>:nth-child(5){display:none}}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--mut);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.run{background:var(--run-bg);color:var(--run)}.pill.run::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:11px;font-weight:600;background:var(--sunk);color:var(--mut);border:1px solid var(--line)}
.tag.low{color:var(--ok)}.tag.medium{color:var(--warn)}.tag.high{color:var(--bad)}
/* compact stepper */
.mini{display:flex;align-items:center}
.mini .n{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mini .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--faint);position:relative}
.mini .g{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.03em}
.mini .l{flex:1;height:2px;background:var(--line2);margin:0 3px 14px;min-width:10px}
.mini .l.done{background:var(--ok)}
.mini .n.done .d{background:var(--ok);border-color:var(--ok);color:#fff}.mini .n.done .g{color:var(--ok)}
.mini .n.active .d{border-color:var(--run);color:var(--run)}.mini .n.active .d::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--run);animation:spin 1s linear infinite}.mini .n.active .g{color:var(--run)}
.mini .n.waiting .d{background:var(--warn);border-color:var(--warn);color:#fff;animation:ring 1.6s infinite}.mini .n.waiting .g{color:var(--warn)}
.mini .n.failed .d{background:var(--bad);border-color:var(--bad);color:#fff}.mini .n.failed .g{color:var(--bad)}
.mini .n.aborted .d{background:var(--faint);border-color:var(--faint);color:#fff}
@media(prefers-color-scheme:dark){.mini .n.done .d,.mini .n.waiting .d,.mini .n.failed .d{color:#0c0e13}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
/* full stepper (drawer) */
.prog{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.track i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .5s}
.track.live i{background:linear-gradient(90deg,var(--ok),var(--run))}
.flow{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.flow{grid-template-columns:1fr;gap:12px}}
.stage{min-width:0;padding-right:14px}
.snode{display:flex;align-items:center;margin-bottom:10px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--mut);border:2px solid var(--line2);position:relative;z-index:1}
.ln{flex:1;height:3px;margin:0 8px;border-radius:2px;background:var(--line2)}
.stage:last-child .ln{visibility:hidden}
.stage.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.stage.done .ln{background:var(--ok)}
.stage.active .dot{border-color:var(--run);color:var(--run);background:var(--run-bg)}.stage.active .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--run);animation:spin 1s linear infinite}
.stage.active .ln{background:linear-gradient(90deg,var(--run),var(--line2))}
.stage.waiting .dot{border-color:var(--warn);background:var(--warn);color:#fff;animation:ring 1.6s infinite}
.stage.failed .dot{border-color:var(--bad);background:var(--bad);color:#fff}.stage.aborted .dot{background:var(--faint);border-color:var(--faint);color:#fff}
@media(prefers-color-scheme:dark){.stage.done .dot,.stage.waiting .dot,.stage.failed .dot{color:#0c0e13}}
.stage .name{font-weight:600;font-size:13px;line-height:1.3}
.gate{display:inline-flex;align-items:center;gap:6px;margin:5px 0 9px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--sunk);color:var(--mut)}
.gate::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:currentColor}
.gate.approved,.gate.auto{background:var(--ok-bg);color:var(--ok)}.gate.waiting{background:var(--warn-bg);color:var(--warn)}.gate.failed{background:var(--bad-bg);color:var(--bad)}
.items{display:grid;gap:4px}
.item{font-size:12px;display:flex;align-items:center;gap:8px;color:var(--mut);min-width:0}
.item .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);flex:none}
.item .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .dt{margin-left:auto;font-size:11px;white-space:nowrap;color:var(--faint)}
.item.done{color:var(--fg)}.item.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.item.working{color:var(--run);font-weight:600}.item.working .ic{border-color:var(--run);border-top-color:transparent;animation:spin .9s linear infinite}
.item.failed{color:var(--bad)}.item.failed .ic{background:var(--bad);border-color:var(--bad);color:#fff}
@media(prefers-color-scheme:dark){.item.done .ic,.item.failed .ic{color:#0c0e13}}
/* feed + bars */
.ev{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .ei{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--mut)}
.ev.t-agent .ei{background:var(--run-bg);color:var(--run)}.ev.t-gate .ei{background:var(--ok-bg);color:var(--ok)}.ev.t-gate.rev .ei{background:var(--warn-bg);color:var(--warn)}.ev.bad .ei{background:var(--bad-bg);color:var(--bad)}
.ev .em{min-width:0;font-size:13px}.ev .et{color:var(--faint);font-size:12px;white-space:nowrap}.ev .en{grid-column:2/4;color:var(--mut);font-size:12px;white-space:pre-wrap}
.bars{padding:6px 16px 12px}.br{padding:7px 0}.br .t{display:flex;justify-content:space-between;gap:8px;font-size:12px}.br .t b{font-weight:600}
.br .b{height:6px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden}.br .b i{display:block;height:100%;background:var(--brand);border-radius:3px}
/* new change dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100% - 28px));box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(10,12,18,.55);backdrop-filter:blur(2px)}
.dlg-h{padding:16px 20px 4px}.dlg-h h2{margin:0;font-size:17px}.dlg-b{padding:8px 20px 4px;display:grid;gap:14px}.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);margin-top:10px}
.fld label.l{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.fld .hint{color:var(--mut);font-size:12px;margin-top:3px}
.fld textarea,.fld select,.fld input[type=text]{width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:8px 10px}.fld textarea{min-height:110px;resize:vertical}
.fld textarea:focus,.fld select:focus,.fld input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.repos{display:flex;flex-wrap:wrap;gap:8px}.repos label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer}
.repos label:has(input:checked){border-color:var(--brand);background:var(--brand-bg)}
/* initiatives */
.init{padding:14px 16px;border-top:1px solid var(--line)}
.init-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.init-k{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-top:10px}
.init-k a{color:var(--fg);text-decoration:none;font-weight:550}.init-k a:hover{text-decoration:underline}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);backdrop-filter:blur(2px);display:none;z-index:20}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,100%);background:var(--bg);z-index:21;display:none;flex-direction:column;box-shadow:var(--shadow-lg);border-left:1px solid var(--line)}
.drawer.on{display:flex;animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.d-head{padding:16px 24px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.d-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}.d-title h2{margin:0;font-size:18px;letter-spacing:-.01em}
.d-idea{color:var(--mut);margin-top:2px}
.d-stats{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:12px;color:var(--mut)}.d-stats b{color:var(--fg);font-weight:600}
.d-body{flex:1;overflow:auto;padding:20px 24px}
.d-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px 24px;box-shadow:0 -4px 16px rgba(16,24,40,.05)}
.xbtn{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.alert{display:flex;gap:10px;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.alert.info{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg);color:var(--warn)}
.alert ul{margin:4px 0 0;padding-left:18px}.alert .tx{min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 8px}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:10px 12px;color:var(--mut);cursor:pointer;font-weight:550;font-size:13px;margin-bottom:-1px}
.tab:hover{color:var(--fg)}.tab.on{border-color:var(--brand);color:var(--fg)}
.pane{padding:18px 22px;max-height:56vh;overflow:auto}
.pane h1,.pane h2,.pane h3,.pane h4{margin:18px 0 6px;font-size:15px;line-height:1.3}.pane h1{font-size:19px;margin-top:4px}.pane h2{font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pane p{margin:6px 0}.pane ul,.pane ol{margin:6px 0;padding-left:22px}.pane li{margin:2px 0}
.pane blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--brand);color:var(--mut)}
.pane pre{background:var(--sunk);border:1px solid var(--line);padding:10px 12px;border-radius:8px;overflow:auto;margin:8px 0;font:12px/1.55 ui-monospace,Menlo,monospace}
.pane code{font:12px ui-monospace,Menlo,monospace;background:var(--sunk);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}.pane pre code{border:0;padding:0;background:none}
.pane table{border-collapse:collapse;margin:10px 0;width:100%}.pane th,.pane td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}.pane th{background:var(--sunk);font-weight:600}
.pane hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pane.flush{padding:0}
.diagram{margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.diagram .dh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.diagram .dh b{color:var(--fg);font-weight:600}.diagram .dh button{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:12px}
.diagram .dv{padding:14px;overflow:auto;text-align:center;max-height:70vh}.diagram .dv svg{max-width:100%;height:auto}
.diagram.big .dv svg{max-width:none}
.diagram pre{margin:0;border:0;border-radius:0;max-height:50vh}
.diagram .derr{color:var(--bad);font-size:12px;padding:8px 12px;border-top:1px solid var(--line)}
.diff pre{margin:0;border:0;border-radius:0;background:none;padding:0}.diff div{padding:0 14px;white-space:pre;min-height:1.55em}.diff .a{background:var(--add)}.diff .d{background:var(--del)}.diff .h{background:var(--hunk);font-weight:600;color:var(--brand)}

const diffView = text => h('div', { class: 'diff' }, h('pre', {}, text.split('\n').map(l =>
  h('div', { class: /^(\+\+\+|---|diff |index )/.test(l) || l.startsWith('@@') ? 'h' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : '' }, l || ' '))));

/* ---------- detail drawer ---------- */
let TAB = null, LAST_FOCUS = null, DEEP = false;
function closeDetail() { OPEN = null; history.replaceState(null, '', location.pathname); $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); LAST_FOCUS?.focus?.(); }
$('scrim').onclick = closeDetail;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN) closeDetail(); });

async function openDetail(repo, id, keepForm) {
  const r = await fetch('/api/change?repo=' + encodeURIComponent(repo) + '&id=' + encodeURIComponent(id));
  if (!r.ok) { toast('Could not load ' + id, true); return; }
  const c = await r.json();
  // A background refresh must not wipe a note or feedback someone is typing.
  if (keepForm && $('drawer').contains(document.activeElement) && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName)) { OPEN = { repo, id, updatedAt: c.updatedAt }; return; }
  if (!OPEN) LAST_FOCUS = document.activeElement;
  const same = OPEN && OPEN.repo === repo && OPEN.id === id;
  OPEN = { repo, id, updatedAt: c.updatedAt };
  history.replaceState(null, '', '#' + repo + '/' + id);
  if (!same && !DEEP) TAB = null;
  DEEP = false;
  renderDetail(c);
  $('drawer').classList.add('on'); $('scrim').classList.add('on');
}

function renderDetail(c) {
  const tabs = [...c.files.map(f => ({ key: f.name, f })), { key: 'checks' }, { key: 'agent notes' }, { key: 'timeline' }, { key: 'approvals' }];
  const preferred = c.awaiting === 'G3' && c.files.some(f => f.name === 'code diff') ? 'code diff' : c.files[0]?.name;
  if (!tabs.some(t => t.key === TAB)) TAB = tabs.some(t => t.key === preferred) ? preferred : tabs[0].key;
  const pane = h('div', { class: 'pane' }), tabBar = h('div', { class: 'tabs', role: 'tablist' });
  const empty = t => [h('div', { class: 'mut' }, t)];
  const show = key => {
    TAB = key;
    tabBar.replaceChildren(...tabs.map(t => h('button', { class: 'tab' + (t.key === key ? ' on' : ''), role: 'tab', 'aria-selected': t.key === key, onclick: () => show(t.key) }, t.key)));
    const t = tabs.find(x => x.key === key);
    pane.className = 'pane' + (t.f?.kind === 'diff' || key === 'timeline' ? ' flush' : '');
    if (t.f) pane.replaceChildren(...(t.f.kind === 'diff' ? [diffView(t.f.text)] : markdown(t.f.text)));
    else if (key === 'checks') pane.replaceChildren(...(c.checks.length ? c.checks.map(k => h('div', { class: 'chk' }, h('span', { class: 'pill ' + (k.ok ? 'ok' : 'bad') }, k.ok ? 'pass' : 'fail'), h('span', {}, k.name + (k.skipped ? ' (skipped)' : '')), !k.ok && k.detail && h('pre', {}, k.detail))) : empty('Checks have not run yet.')),
      ...(c.blocking.length ? [h('h3', {}, 'Blocking review findings'), h('ul', {}, c.blocking.map(b => h('li', {}, b)))] : []));
    else if (key === 'agent notes') pane.replaceChildren(...(c.notes.length ? c.notes.map(n => h('div', { class: 'note' }, h('b', {}, n.role + ' · ' + n.key), n.text)) : empty('No agent notes yet.')),
      ...(c.decisions.length ? [h('h3', {}, 'Decisions recorded by approvers'), h('ul', {}, c.decisions.map(d => h('li', {}, gn(d.gate).label + ': ' + d.note)))] : []));
    else if (key === 'timeline') pane.replaceChildren(...(c.events.length ? c.events.map(e => eventRow(e, false)) : empty('No events recorded yet.')));
    else pane.replaceChildren(...(c.approvals ? markdown(c.approvals) : empty('No gate decisions recorded yet.')));
  };
  show(TAB);

  const { done, total } = steps(c);
  const head = h('div', { class: 'd-head' },
    h('div', { class: 'crumb' }, c.repo, ' / ', c.branch || '', h('button', { class: 'btn ghost xbtn', onclick: closeDetail, 'aria-label': 'Close' }, icon('x', 16, 2.2))),
    h('div', { class: 'd-title' }, h('h2', {}, c.id), statusPill(c), h('span', { class: 'tag ' + c.risk }, c.risk + ' risk')),
    c.idea && h('div', { class: 'd-idea' }, c.idea.split('\n')[0]),
    h('div', { class: 'd-stats' }, h('span', {}, 'Cost ', h('b', {}, money(c.cost))), h('span', {}, 'Steps ', h('b', {}, done + '/' + total)), h('span', {}, 'Risk set by ', h('b', {}, c.riskSource || 'default')),
      c.lastRun && h('span', {}, 'Last agent run ', h('b', {}, c.lastRun.label), ' ' + ago(c.lastRun.at)), h('span', {}, 'Updated ', h('b', {}, ago(c.updatedAt)))));
  const alert = (cls, ...kids) => h('div', { class: 'alert' + cls, role: 'alert' }, h('div', { class: 'tx' }, kids));
  const body = h('div', { class: 'd-body' }, h('div', { class: 'card' }, flow(c)),
    c.error && alert('', c.error),
    c.heldByTerminal && alert(' info', 'A terminal session (pid ' + c.pid + ') is waiting at this gate. Answer it there; approving here would race with it.'),
    c.revision && alert(' info', h('b', {}, 'Revision in progress (' + gn(c.revision.gate).label + '): '), c.revision.feedback),
    c.awaiting && c.blockers.length > 0 && alert('', h('b', {}, 'Approval is blocked'), h('ul', {}, c.blockers.map(b => h('li', {}, b.text)))),
    h('div', { class: 'card', style: 'padding:0;overflow:hidden' }, tabBar, pane));
  $('drawer').replaceChildren(head, body, footer(c));
}

function footer(c) {
  const foot = h('div', { class: 'd-foot' });
  const busy = fn => async ev => { const b = ev.currentTarget; b.disabled = true; try { await fn(); } finally { b.disabled = false; } };
  const run = async body => {
    const r = await post({ repo: c.repo, id: c.id, ...body });
    toast(r.ok ? (r.started ? 'Done. The pipeline is continuing in the background.' : 'Done.') : r.error, !r.ok);
    await load(); if (r.ok) closeDetail(); else openDetail(c.repo, c.id);
  };
  if (c.heldByTerminal) { foot.append(h('span', { class: 'mut' }, 'Controls are disabled while a terminal holds this gate.')); return foot; }
  if (c.running) { foot.append(h('span', { class: 'mut' }, 'Agents are working. Controls return when the next gate is reached.')); return foot; }
  if (!c.awaiting) {
    if (c.status === 'failed' || c.stalled || c.status === 'aborted') foot.append(h('div', { class: 'form' }, h('div', { class: 'btns' }, h('button', { class: 'btn brand', onclick: busy(() => run({ action: 'resume', force: c.status === 'aborted' })) }, icon('play', 12, 2.5), c.status === 'aborted' ? 'Resume aborted change' : 'Resume'),
      h('span', { class: 'mut small' }, c.status === 'aborted' ? 'The branch and worktree were kept; it continues from the last gate.' : 'Fix the cause first if the error above points at one.'))));
    else foot.append(h('span', { class: 'mut' }, c.status === 'done' ? 'This change is finished.' : 'Nothing to decide right now.'));
    return foot;
  }
  const note = h('textarea', { placeholder: 'Note for the record (optional). Saved in approvals.md and given to later agents as a decision.', 'aria-label': 'Note' });
  const blocked = c.blockers.length > 0;
  const override = h('input', { type: 'checkbox', id: 'ov' });
  const risk = c.awaiting === 'G1' && h('select', { title: 'Risk tier decides which later gates need a human', 'aria-label': 'Risk tier' }, ['low', 'medium', 'high'].map(r => h('option', { value: r, selected: r === c.risk }, 'Risk: ' + r)));
  const fb = h('textarea', { placeholder: 'What should change? Be specific; the owning agents rewrite their artifacts from this.', 'aria-label': 'Feedback' });
  const stage = h('select', { 'aria-label': 'Restart from stage' }, c.stageIds.map(s => h('option', { value: s, selected: s === c.stageIds[c.stageIds.length - 1] }, 'Restart from: ' + s)));
  const revForm = h('div', { class: 'form', hidden: true }, fb, h('div', { class: 'btns' }, stage, h('span', { class: 'sp' }),
    h('button', { class: 'btn', onclick: () => revForm.hidden = true }, 'Cancel'),
    h('button', { class: 'btn warn', onclick: busy(() => fb.value.trim() ? run({ action: 'revise', feedback: fb.value, stage: stage.value }) : toast('Say what should change.', true)) }, 'Send back for revision')));
  const approve = h('button', { class: 'btn primary', id: 'approve', onclick: busy(() => run({ action: 'approve', note: note.value, override: blocked && override.checked, risk: risk && risk.value })) },
    icon('check', 14, 3), blocked ? 'Approve anyway' : 'Approve ' + c.awaiting);
  foot.append(h('div', { class: 'form' }, note,
    h('div', { class: 'btns' }, approve,
      h('button', { class: 'btn', onclick: () => { revForm.hidden = !revForm.hidden; if (!revForm.hidden) fb.focus(); } }, icon('undo', 14, 2.2), 'Request changes'),
      risk,
      blocked && h('label', { class: 'small', style: 'color:var(--bad);display:flex;gap:6px;align-items:center' }, override, 'Override the blockers (recorded as an override)'),
      h('span', { class: 'sp' }),
      h('button', { class: 'btn danger', onclick: busy(async () => { if (confirm('Abort this change? Its branch and worktree are kept.')) await run({ action: 'abort' }); }) }, 'Abort')),
    revForm,
    c.approvers.length > 0 && h('div', { class: 'mut small' }, 'Approvers for ' + c.awaiting + ': ' + c.approvers.join(', ') + (c.me ? ' · you are ' + (c.me.email || c.me.name) : ''))));
  if (blocked) { approve.disabled = true; override.addEventListener('change', () => { approve.disabled = !override.checked; approve.className = 'btn ' + (override.checked ? 'warn' : 'primary'); }); }
  return foot;
}

/* ---------- start a change or an initiative ---------- */
$('new').onclick = () => newChange();
function newChange() {
  const d = DATA, dlg = $('dlg');
  if (!d.repos.length) { toast('No repos registered yet. Add one with: agentic repo add <name> <path>', true); return; }
  const idea = h('textarea', { placeholder: 'e.g. Partners can refund settled payouts within 30 days. Say who it is for and what should be true afterwards.', 'aria-label': 'Idea' });
  const checks = d.repos.map((r, i) => h('input', { type: 'checkbox', value: r, checked: i === 0 && d.repos.length === 1 }));
  const risk = h('select', { 'aria-label': 'Risk tier' }, h('option', { value: '' }, 'Let the Product Analyst decide (you can change it at Proposal approval)'), ['low', 'medium', 'high'].map(r => h('option', { value: r }, r)));
  const id = h('input', { type: 'text', placeholder: 'optional, e.g. refund-window', pattern: '[a-z0-9]+(-[a-z0-9]+)*', 'aria-label': 'Change id' });
  const hint = h('div', { class: 'hint' });
  const submit = h('button', { class: 'btn brand', type: 'button' });
  const picked = () => checks.filter(c => c.checked).map(c => c.value);
  const sync = () => {
    const n = picked().length;
    hint.textContent = n > 1 ? 'Starts one change per repo as an initiative; you approve the gates together.' : n === 1 ? 'Starts one change. It runs research and proposal, then waits for you at Proposal approval.' : 'Pick at least one repo.';
    submit.textContent = n > 1 ? 'Start initiative' : 'Start change'; submit.disabled = !n;
  };
  checks.forEach(c => c.addEventListener('change', sync)); sync();
  submit.onclick = async () => {
    if (!idea.value.trim()) { idea.focus(); toast('Describe the change first.', true); return; }
    const repos = picked(); submit.disabled = true;
    const body = repos.length > 1 ? { action: 'initiative-start', repos, idea: idea.value, risk: risk.value, id: id.value.trim() } : { action: 'start', repo: repos[0], idea: idea.value, risk: risk.value, id: id.value.trim() };
    const r = await post(body);
    submit.disabled = false;
    if (!r.ok) { toast(r.error, true); return; }
    dlg.close(); toast(r.started ? 'Started. Agents are working; it will wait for you at Proposal approval.' : 'Started.'); setTimeout(() => load().catch(() => {}), 1500);
  };
  dlg.replaceChildren(
    h('div', { class: 'dlg-h' }, h('h2', { id: 'dlg-t' }, 'New change'), h('div', { class: 'mut small' }, 'Agents will research and draft a proposal, then stop at Proposal approval.')),
    h('div', { class: 'dlg-b' },
      h('div', { class: 'fld' }, h('label', { class: 'l' }, 'What do you want?'), idea),
      h('div', { class: 'fld' }, h('label', { class: 'l' }, 'Repos'), h('div', { class: 'repos' }, d.repos.map((r, i) => h('label', {}, checks[i], r))), hint),
      h('div', { class: 'fld' }, h('label', { class: 'l' }, 'Risk tier'), risk),
      h('div', { class: 'fld' }, h('label', { class: 'l' }, 'Id'), id)),
    h('div', { class: 'dlg-f' }, h('button', { class: 'btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'), submit));
  dlg.showModal(); idea.focus();
}

$('refresh').onclick = () => load().then(() => toast('Refreshed.')).catch(e => toast(e.message, true));
const lost = () => { $('live').classList.add('off'); $('stamp').textContent = 'Connection lost · retrying'; };
load().then(() => { if (location.hash === '#new') return newChange(); const m = location.hash.match(/^#([a-z0-9-]+)\/([a-z0-9-]+)(?:\/(.+))?$/); if (m) { if (m[3]) { TAB = decodeURIComponent(m[3]); DEEP = true; } openDetail(m[1], m[2]); } }).catch(lost);
setInterval(() => load().catch(lost), 4000);
